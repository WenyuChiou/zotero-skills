# Local pre-commit hooks — catch secrets and lint errors before they land.
#   Install:  pip install pre-commit && pre-commit install
#   Refresh pinned versions:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^(scripts|tests)/.*\.py$
